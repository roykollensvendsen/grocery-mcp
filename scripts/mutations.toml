# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/kassalapp_mcp/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a search shorter than kassalapp allows is never sent"
file = "src/kassalapp_mcp/source.py"
find = 'if len\(words\) < MIN_SEARCH:'
replace = 'if False:'

[[rule]]
name = "without a key nothing is sent"
file = "src/kassalapp_mcp/source.py"
find = 'if not key:'
replace = 'if False:'

[[rule]]
name = "several matches give a question never a guess"
file = "src/kassalapp_mcp/answers.py"
find = 'offered = found\[:MOST_CHOICES\]'
replace = 'return found[0]'

[[rule]]
name = "a price older than fourteen days is never called current"
file = "src/kassalapp_mcp/answers.py"
find = 'current = sorted\(\(p for p in prices if self._current\(p\)\), key=lambda p: p.price\)'
replace = 'current = sorted((p for p in prices if p.seen_at is not None), key=lambda p: p.price)'

[[rule]]
name = "every tool answers with a sentence even when it fails"
file = "src/kassalapp_mcp/server.py"
find = 'except httpx.TransportError as failure:'
replace = 'except ZeroDivisionError as failure:'

[[rule]]
name = "search words are never logged"
file = "src/kassalapp_mcp/source.py"
find = 'logging.getLogger\(_library\).setLevel\(logging.WARNING\)'
replace = 'logging.getLogger(_library).setLevel(logging.NOTSET)'

[[rule]]
name = "a cached price is used for six hours"
file = "src/kassalapp_mcp/cache.py"
find = 'if row and now < dt.datetime.fromisoformat\(row\[0\]\):'
replace = 'if False:'

[[rule]]
name = "a price fetched before nine is held only until ten"
file = "src/kassalapp_mcp/cache.py"
find = 'if oslo.time\(\) < UPDATE_STARTS:'
replace = 'if False:'

[[rule]]
name = "a 429 stops calls until retry after passes"
file = "src/kassalapp_mcp/quota.py"
find = 'if self._until is not None and now < self._until:'
replace = 'if False:'

[[rule]]
name = "the level warns at twelve remaining"
file = "src/kassalapp_mcp/quota.py"
find = 'by_header = remaining is not None and remaining <= limit \* WARN_SHARE'
replace = 'by_header = remaining is not None and remaining < limit * WARN_SHARE'

[[rule]]
name = "the usage log never holds a search word or barcode"
file = "src/kassalapp_mcp/source.py"
find = 'self._quota.after_call\(path, response\)'
replace = 'self._quota.after_call(str(response.request.url), response)'

[[rule]]
name = "a stale price is never the cheapest"
file = "src/kassalapp_mcp/answers.py"
find = 'current = sorted\(\(p for p in prices if self._current\(p\)\), key=lambda p: \(p.price, p.chain_name\)\)'
replace = 'current = sorted((p for p in prices if p.seen_at is not None), key=lambda p: (p.price, p.chain_name))'

[[rule]]
name = "the status file is replaced whole never written in place"
file = "src/kassalapp_mcp/quota.py"
find = '_replace\(self._dir / "status.json", json.dumps\(self.bridge_status\(full\), indent=1\)\)'
replace = '(self._dir / "status.json").write_text(json.dumps(self.bridge_status(full), indent=1))'

[[rule]]
name = "answering an offered choice gives a price never the question again"
file = "src/kassalapp_mcp/answers.py"
find = 'if len\(found\) == 1 or len\(exact\) == 1:'
replace = 'if len(found) == 1:'

[[rule]]
name = "an error from kassalapp is put on kassalapp"
file = "src/kassalapp_mcp/server.py"
find = 'except httpx.HTTPStatusError as failure:'
replace = 'except ZeroDivisionError as failure:'
